<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartographer's Fog</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        background: #f4ecd8;
        color: #4a3728;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #241d15; color: #d9c7a7; }
      }
      main { text-align: center; padding: 2rem; max-width: 34rem; }
      h1 { font-weight: 500; letter-spacing: 0.02em; margin: 0 0 0.75rem; }
      p { margin: 0.5rem 0; opacity: 0.85; line-height: 1.5; }
      .sub { font-style: italic; opacity: 0.7; }
      code { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cartographer's Fog</h1>
      <p class="sub">Explored ground stays on the map, drawn by hand.</p>
      <p>
        An Owlbear Rodeo extension that remembers where your party has been and sketches it
        back in — a companion to
        <a href="https://extensions.owlbear.rodeo/dynamic-fog">Dynamic Fog</a>, not a
        replacement for it.
      </p>
      <p><code>Pre-release — nothing to install yet.</code></p>
      <p>
        <a href="https://github.com/CaptainChocolatedessert/cartographers-fog">Source on GitHub</a>
      </p>
    </main>
  </body>
</html>
